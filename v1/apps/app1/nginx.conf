server {
    listen 80;
    server_name _;

    # app servido sob /app1/ (assets gerados com base '/app1/')
    location /app1/ {
        alias /usr/share/nginx/html/app1/;
        try_files $uri $uri/ /app1/index.html;
    }

    # conveniência: raiz do container redireciona pro app
    location = / {
        return 302 /app1/;
    }
}
